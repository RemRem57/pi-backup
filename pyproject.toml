[project]
name = "pi-backup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "slack-sdk>=3.0",
    "prometheus-client>=0.19",
    "loguru>=0.7",
    "hatchling>=1.29.0",
]

[project.scripts]
pi-backup = "backup.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backup"]
